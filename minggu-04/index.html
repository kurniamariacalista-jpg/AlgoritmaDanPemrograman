<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Angka Terbesar dari Array</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7ff, #eef4ff);
        color: #1f2937;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }

      h1 {
        text-align: center;
        color: #1d4ed8;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #475569;
        margin-bottom: 24px;
      }

      .flowchart {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin: 24px 0;
      }

      .box {
        background: #e0ecff;
        border: 2px solid #93c5fd;
        border-radius: 12px;
        padding: 14px 12px;
        text-align: center;
        font-weight: bold;
        color: #1e3a8a;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      textarea {
        width: 100%;
        min-height: 110px;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 16px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
      }

      button:hover {
        background: #1d4ed8;
      }

      .reset-btn {
        background: #e2e8f0;
        color: #0f172a;
      }

      .reset-btn:hover {
        background: #cbd5e1;
      }

      .hasil {
        margin-top: 24px;
        padding: 16px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #dbeafe;
      }

      .hasil p {
        margin: 6px 0;
        font-size: 16px;
      }

      .error {
        color: #b91c1c;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Mencari 3 Angka Terbesar dari Array</h1>
        <p class="subtitle">Contoh implementasi logika algoritma dalam HTML + JavaScript</p>

        <div class="flowchart">
          <div class="box">Mulai</div>
          <div class="box">Inisialisasi max1, max2, max3</div>
          <div class="box">Bandingkan tiap elemen</div>
          <div class="box">Update nilai terbesar</div>
          <div class="box">Tampilkan 3 terbesar</div>
          <div class="box">Selesai</div>
        </div>

        <label for="arrayInput">Masukkan angka array (pisahkan dengan koma, spasi, atau enter):</label>
        <textarea id="arrayInput">12, 45, 7, 90, 32, 60, 18</textarea>

        <div class="actions">
          <button id="hitungBtn">Hitung 3 Terbesar</button>
          <button id="resetBtn" class="reset-btn" type="button">Reset</button>
        </div>

        <div class="hasil" id="hasil">
          <p>Hasil akan ditampilkan di sini.</p>
        </div>
      </div>
    </div>

    <script>
      const arrayInput = document.getElementById('arrayInput');
      const hasil = document.getElementById('hasil');

      function parseArray(text) {
        return text
          .split(/[\s,\n]+/)
          .map((value) => value.trim())
          .filter((value) => value !== '')
          .map(Number);
      }

      function cariTigaTerbesar(arr) {
        let max1 = -Infinity;
        let max2 = -Infinity;
        let max3 = -Infinity;

        for (let i = 0; i < arr.length; i++) {
          if (arr[i] > max1) {
            max3 = max2;
            max2 = max1;
            max1 = arr[i];
          } else if (arr[i] > max2) {
            max3 = max2;
            max2 = arr[i];
          } else if (arr[i] > max3) {
            max3 = arr[i];
          }
        }

        return { max1, max2, max3 };
      }

      document.getElementById('hitungBtn').addEventListener('click', function () {
        const input = arrayInput.value;
        const data = parseArray(input);

        if (data.length === 0 || data.some((nilai) => Number.isNaN(nilai))) {
          hasil.innerHTML = '<p class="error">Input tidak valid. Masukkan angka yang benar, contoh: 12, 45, 7, 90</p>';
          return;
        }

        const result = cariTigaTerbesar(data);

        hasil.innerHTML = `
          <p><strong>Array:</strong> [${data.join(', ')}]</p>
          <p><strong>Angka terbesar 1:</strong> ${result.max1}</p>
          <p><strong>Angka terbesar 2:</strong> ${result.max2}</p>
          <p><strong>Angka terbesar 3:</strong> ${result.max3}</p>
        `;
      });

      document.getElementById('resetBtn').addEventListener('click', function () {
        arrayInput.value = '12, 45, 7, 90, 32, 60, 18';
        hasil.innerHTML = '<p>Hasil akan ditampilkan di sini.</p>';
      });
    </script>
  </body>
</html>
